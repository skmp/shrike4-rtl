<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SH-4 vector FPU — step calculator</title>
<style>
  :root {
    --bg:#141820; --panel:#1c2230; --panel-s:#2a3244; --box:#232b3b; --txt:#eef1f6; --sub:#9aa6ba;
    --dim:#39445a; --dimt:#65718a; --hw:#ef6f80; --amb:#f2b632; --blu:#5bb2d6; --wire:#9fb0cc;
    --mono:'DejaVu Sans Mono',Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px Helvetica,Arial,'Liberation Sans',sans-serif; }
  #topbar { position:sticky; top:0; z-index:20; background:var(--bg); box-shadow:0 8px 14px -10px #000; }
  header { padding:14px 18px 6px; }
  h1 { margin:0; font-size:20px; letter-spacing:-0.2px; }
  h1 span { color:var(--sub); font-size:13px; font-weight:normal; margin-left:10px; }
  .tabs { display:flex; gap:6px; padding:10px 18px 0; border-bottom:1px solid var(--panel-s); }
  .tabs button { background:var(--box); color:var(--sub); border:1px solid var(--panel-s); border-bottom:none;
    padding:8px 18px; border-radius:7px 7px 0 0; font:600 14px var(--mono); cursor:pointer; }
  .tabs button.on { background:var(--panel); color:var(--txt); border-color:var(--amb); }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; padding:12px 18px;
    background:var(--panel); border-bottom:1px solid var(--panel-s); }
  .grp { display:flex; flex-direction:column; gap:4px; }
  .grp > label { font-size:11px; color:var(--dimt); text-transform:uppercase; letter-spacing:1px; }
  .row { display:flex; gap:5px; }
  input[type=text] { width:92px; background:var(--box); color:var(--txt); border:1px solid var(--panel-s);
    border-radius:4px; padding:5px 6px; font:12px var(--mono); }
  input[type=text].mat { width:78px; }
  input:focus { outline:1px solid var(--amb); }
  select { background:var(--box); color:var(--txt); border:1px solid var(--panel-s); border-radius:4px; padding:5px; font:12px var(--mono); }
  .transport { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .transport button { background:var(--box); color:var(--txt); border:1px solid var(--panel-s); border-radius:6px;
    padding:8px 14px; font:600 13px var(--mono); cursor:pointer; }
  .transport button:hover:not(:disabled) { border-color:var(--amb); }
  .transport button:disabled { color:var(--dim); cursor:default; }
  #cyc { font:700 14px var(--mono); color:var(--amb); min-width:118px; text-align:center; }
  .stage { padding:8px 18px 10px; font:600 14px Helvetica,Arial,sans-serif; }
  .stage em { color:var(--amb); font-style:normal; font-family:var(--mono); margin-right:10px; }
  main { display:flex; gap:12px; padding:8px 18px 18px; align-items:stretch; }
  #diagram { flex:0 1 1010px; min-width:0; align-self:flex-start; position:sticky; top:calc(var(--topbar, 0px) + 8px); }
  #diagram svg { width:100%; max-width:1010px; height:auto; display:block; }
  /* the log matches the circuit's height and grows past it instead of scrolling inside */
  #logpane { flex:1 1 400px; min-width:340px; max-width:640px; background:var(--panel); border:1px solid var(--panel-s); border-radius:10px;
    padding:10px 12px; font:11.5px/1.45 var(--mono); }
  #logpane h2 { font:600 11px Helvetica,Arial,sans-serif; letter-spacing:1px; text-transform:uppercase;
    color:var(--amb); margin:0 0 8px; }
  .cyc { margin-bottom:10px; opacity:0.45; scroll-margin-top:calc(var(--topbar, 0px) + 10px); }
  .cyc.now { opacity:1; }
  .cyc > .hd { color:var(--blu); font-weight:700; border-bottom:1px solid var(--panel-s); padding-bottom:2px; margin-bottom:3px; }
  .cyc.now > .hd { color:var(--amb); }
  .ln { display:flex; gap:6px; padding:1px 0; }
  .ln .p { flex:0 0 96px; color:var(--hw); }
  .ln .v { flex:1 1 auto; color:var(--txt); word-break:break-word; }
  footer { color:var(--dimt); font-size:11.5px; padding:0 18px 20px; }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<div id="topbar">
  <header>
    <h1>SH-4 vector FPU interactive calculator</h1>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <section class="controls" id="controls"></section>
  <div class="stage" id="stage"></div>
</div>

<main>
  <div id="diagram"></div>
  <aside id="logpane"><h2>circuit log</h2><div id="log"></div></aside>
</main>

<script src="tables.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------- geometry (the animation's layout, header removed)
const LANES = [263, 473, 683, 893], MUX_DX = 46;
const BA = 116, RY = { reg: 116, dx: 130, rom: 144, fb0: 158, fb2: 172 };
const A_IN = ['reg', 'dx', 'fb0', 'fb2'], B_IN = ['reg', 'dx', 'rom', 'fb0', 'fb2'];
const A_OFF = [-27, -9, 9, 27], B_OFF = [-30, -15, 0, 15, 30];
const MUX_Y = 188, LAT_Y = 220, FM_Y = 266, TAP0 = 352, TAP2 = 360, M_Y = 368, SMUX_Y = 412,
      AL_Y = 446, AD_Y = 510, SUM_Y = 570, NR_Y = 612, RES_Y = 674, OUT_Y = 744;
const BND = [[235, 'input latches'], [383, 'product registers'], [585, 'sum register'], [689, 'result register']];
const BANDS = [[10, 235, 'RR · read + select'], [235, 383, 'F1 · multiply'], [383, 585, 'F2 · align + add'],
               [585, 689, 'F3 · round'], [689, 760, 'WB']];
const SRCBOX = { regs: [158, 262, 'FR registers', 'reg', 289], dec: [436, 284, 'decode', 'dx', 578],
                 rom: [736, 264, 'coefficient ROM', 'rom', 868] };
const COL = { reg: 'var(--wire)', dx: 'var(--blu)', rom: 'var(--amb)', fb0: 'var(--hw)', fb2: 'var(--hw)' };
const C = { dim: '#39445a', dimt: '#65718a', box: '#232b3b', panel: '#1c2230', txt: '#eef1f6', sub: '#9aa6ba',
            hw: '#ef6f80', amb: '#f2b632', blu: '#5bb2d6', wire: '#9fb0cc' };
const MONO = "'DejaVu Sans Mono',Menlo,Consolas,monospace";
const SVGNS = 'http://www.w3.org/2000/svg';

function el(tag, at, txt) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in at) n.setAttribute(k, at[k]);
  if (txt !== undefined) n.textContent = txt;
  return n;
}
const P = (pts) => pts.map((p) => p[0] + ',' + p[1]).join(' ');
function line(g, pts, col, w, o, dash, arrow) {
  const n = el('polyline', { points: P(pts), fill: 'none', stroke: col, 'stroke-width': w || 1.5, 'stroke-linejoin': 'round' });
  if (o) n.setAttribute('stroke-opacity', o);
  if (dash) n.setAttribute('stroke-dasharray', dash);
  if (arrow) n.setAttribute('marker-end', 'url(#ar-' + arrow + ')');
  g.appendChild(n); return n;
}
function box(g, x, y, w, h, stroke, fill, sw, rx, fo) {
  const n = el('rect', { x, y, width: w, height: h, rx: rx === undefined ? 5 : rx, fill: fill || 'none',
    stroke: stroke || C.dim, 'stroke-width': sw || 1.4 });
  if (fo) n.setAttribute('fill-opacity', fo);
  g.appendChild(n); return n;
}
function txt(g, x, y, s, size, col, anchor, weight, mono) {
  const n = el('text', { x, y, 'font-size': size, fill: col, 'text-anchor': anchor || 'start', 'font-weight': weight || 'normal' }, s);
  if (mono) n.setAttribute('font-family', MONO);
  g.appendChild(n); return n;
}
function hilite(g, x, y, w, h, stroke, tint, sw, rx) {     // opaque, so the dim base text does not show through
  box(g, x, y, w, h, stroke, C.box, sw, rx);
  box(g, x, y, w, h, 'none', tint, 0, rx, 0.20);
}
function trap(g, cx, y, half, stroke, sw) {
  g.appendChild(el('polygon', { points: P([[cx - half, y], [cx + half, y], [cx + half - 11, y + 24], [cx - half + 11, y + 24]]),
    fill: C.box, stroke: stroke || C.dim, 'stroke-width': sw || 1.2 }));
}
function reg(g, x, y, w, h, stroke) {
  box(g, x, y, w, h, stroke || C.dim, C.box, 1.6, 3);
  g.appendChild(el('path', { d: `M${x + 1},${y + h / 2 - 6} L${x + 8},${y + h / 2} L${x + 1},${y + h / 2 + 6}`,
    fill: 'none', stroke: stroke || C.dim, 'stroke-width': 1.4 }));
}

// ---------------------------------------------------------------- the static, dim diagram
let svg, ovG;
function buildDiagram() {
  svg = el('svg', { viewBox: '22 8 1010 754', width: 1010, height: 754 });
  const defs = el('defs');
  for (const [k, c] of Object.entries({ w: C.wire, r: C.hw, a: C.amb, b: C.blu, d: C.dim })) {
    const m = el('marker', { id: 'ar-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    m.appendChild(el('path', { d: 'M0,1 L10,5 L0,9 z', fill: c }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);
  const g = el('g');
  svg.appendChild(g);
  box(g, 24, 10, 1006, 750, C.panel_s || '#2a3244', C.panel, 1.2, 12);
  BANDS.forEach(([y0, y1, name], i) => {
    if (i % 2) { const r = box(g, 25, y0, 1004, y1 - y0, 'none', '#ffffff', 0, 0); r.setAttribute('fill-opacity', 0.022); }
    const t = txt(g, 42, (y0 + y1) / 2, name, 12, C.dimt, 'middle', 'bold');
    t.setAttribute('transform', `rotate(-90 42 ${(y0 + y1) / 2})`);
  });
  BND.forEach(([y, lab]) => { line(g, [[155, y], [1018, y]], '#4b5978', 1.6, null, '12,7'); txt(g, 146, y - 6, lab, 10, C.dimt, 'end', null, true); });
  for (const k in SRCBOX) {
    const [x, w, lab] = SRCBOX[k];
    box(g, x, 26, w, 72, C.dim, C.box);
    txt(g, x + 10, 44, lab, 13, C.dimt, null, 'bold');
    g.appendChild(el('g', { id: 'srct-' + k }));
  }
  for (const k in RY) {
    line(g, [[150, RY[k]], [k === 'fb2' ? 1001 : k === 'fb0' ? 991 : 975, RY[k]]], COL[k], 1.6, 0.4);
    txt(g, 146, RY[k] + 3.5, { reg: 'FVm · FVn', dx: 'dx', rom: 'coeff', fb0: 'M0 »3', fb2: 'M2 »3' }[k], 9.5, C.dimt, 'end', null, true);
  }
  for (const k in SRCBOX) { const [, , , rail, dx] = SRCBOX[k]; line(g, [[dx, 98], [dx, RY[rail]]], COL[rail], 1.5, 0.4); }
  LANES.forEach((cx, i) => {
    [[cx - MUX_DX, A_IN, A_OFF, 'A 25b'], [cx + MUX_DX, B_IN, B_OFF, 'B 28b']].forEach(([mx, ins, offs, lab]) => {
      ins.forEach((k, j) => line(g, [[mx + offs[j], RY[k]], [mx + offs[j], MUX_Y]], COL[k], 1.1, 0.28));
      trap(g, mx, MUX_Y, 37);
      line(g, [[mx, MUX_Y + 24], [mx, LAT_Y]], C.dim, 1.4);
      reg(g, mx - 42, LAT_Y, 84, 30);
      txt(g, mx - 34, LAT_Y + 13, lab, 8.6, C.dimt, null, null, true);
      line(g, [[mx, LAT_Y + 30], [mx, FM_Y - 2]], C.dim, 1.4, null, null, 'd');
    });
    box(g, cx - 88, FM_Y, 176, 78, C.dim, C.box, 1.5, 8);
    txt(g, cx - 79, FM_Y + 17, 'FM' + i, 13, C.dimt, null, 'bold');
    txt(g, cx + 79, FM_Y + 17, '25b × 28b', 9, C.dimt, 'end', null, true);
    txt(g, cx, FM_Y + 70, 'Booth, rows cut below col 16', 8.6, C.dimt, 'middle');
    line(g, [[cx, FM_Y + 78], [cx, M_Y]], C.dim, 1.4);
    reg(g, cx - 56, M_Y, 112, 30);
    txt(g, cx - 50, M_Y + 13, 'M' + i + ' 29b', 8.6, C.dimt, null, null, true);
    line(g, [[cx, M_Y + 30], [cx, i === 1 ? SMUX_Y : AL_Y - 2]], C.dim, 1.4, null, null, 'd');
    box(g, cx - 74, AL_Y, 148, 52, C.dim, C.box, 1.4, 6);
    txt(g, cx, AL_Y + 16, 'align', 12, C.dimt, 'middle', 'bold');
    txt(g, cx + 68, AL_Y + 16, 'slot ' + i, 9, C.dimt, 'end', null, true);
    line(g, [[cx, AL_Y + 52], [cx, AD_Y - 2]], C.dim, 1.4, null, null, 'd');
  });
  trap(g, LANES[1], SMUX_Y, 42);
  txt(g, LANES[1], SMUX_Y + 16, 'M1 | C0', 9.5, C.dimt, 'middle', null, true);
  line(g, [[LANES[1], SMUX_Y + 24], [LANES[1], AL_Y - 2]], C.dim, 1.4, null, null, 'd');
  line(g, [[LANES[0], TAP0], [991, TAP0], [991, RY.fb0]], C.hw, 1.4, 0.35);
  line(g, [[LANES[2], TAP2], [1001, TAP2], [1001, RY.fb2]], C.hw, 1.4, 0.35);
  box(g, 966, 200, 50, 22, C.dim, C.panel, 1.2, 4);
  txt(g, 991, 215, '>>>3', 10, C.dimt, 'middle', 'bold', true);
  line(g, [[1000, 66], [1013, 66], [1013, SMUX_Y + 12], [LANES[1] + 44, SMUX_Y + 12]], C.amb, 1.4, 0.35);
  g.appendChild(el('polygon', { points: P([[64, AD_Y], [990, AD_Y], [860, AD_Y + 50], [194, AD_Y + 50]]),
    fill: C.box, stroke: C.dim, 'stroke-width': 1.4 }));
  txt(g, 214, AD_Y + 26, '4-input adder', 13, C.dimt, null, 'bold');
  txt(g, 214, AD_Y + 40, 'sum = Σ q[i] + Σ cin[i]  ·  35b', 9.5, C.dimt, null, null, true);
  line(g, [[527, AD_Y + 50], [527, SUM_Y]], C.dim, 1.4);
  reg(g, 417, SUM_Y, 220, 30); txt(g, 425, SUM_Y + 19, 'sum 35b', 9.5, C.dimt, null, null, true);
  line(g, [[527, SUM_Y + 30], [527, NR_Y - 2]], C.dim, 1.4, null, null, 'd');
  box(g, 347, NR_Y, 360, 50, C.dim, C.box, 1.5, 8);
  txt(g, 527, NR_Y + 17, 'normalise + round', 13, C.dimt, 'middle', 'bold');
  txt(g, 527, NR_Y + 31, 'negate · |·| · leading one · 24b · RN/RZ', 9.5, C.dimt, 'middle', null, true);
  line(g, [[527, NR_Y + 50], [527, RES_Y]], C.dim, 1.4);
  reg(g, 417, RES_Y, 220, 30); txt(g, 425, RES_Y + 19, 'result 32b', 9.5, C.dimt, null, null, true);
  line(g, [[527, RES_Y + 30], [527, OUT_Y - 18]], C.dim, 1.4, null, null, 'd');
  txt(g, 527, OUT_Y, 'FR / FV register file', 11, C.dimt, 'middle', null, true);
  ovG = el('g', { id: 'ov' });
  svg.appendChild(ovG);
  const host = document.getElementById('diagram');
  host.innerHTML = ''; host.appendChild(svg);
}

// ---------------------------------------------------------------- the bright, per-cycle overlay
// hx() (BigInt → hex) comes from engine.js
const hx32 = (b) => '0x' + ((b >>> 0).toString(16).padStart(8, '0'));
const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

function drawOverlay(cy) {
  const g = el('g'); ovG.replaceWith(g); ovG = g; g.setAttribute('id', 'ov');
  const bx = OPS[state.op].boxes || ['', '', ''];
  ['regs', 'dec', 'rom'].forEach((k, bi) => {
    const [x] = SRCBOX[k];
    bx[bi].split('\n').forEach((ln, li) => txt(g, x + 10, 60 + li * 10.6, ln, 8.4, C.dimt, null, null, true));
  });
  const used = {};
  if (!cy.hold) for (const i in (cy.lat || {})) { const pr = cy.lat[i]; [pr.a, pr.b].forEach((sv) => { if (sv && sv.src !== 'hold') used[sv.src] = 1; }); }
  const srcOn = new Set(cy.src || []);                    // a read of any rail lights its source box too
  if (used.reg) srcOn.add('regs');
  if (used.dx) srcOn.add('dec');
  if (used.rom || cy.c0) srcOn.add('rom');                // C0 is a ROM read as well, on its own wire
  srcOn.forEach((k) => {
    const [x, w, lab, rail, dx] = SRCBOX[k];
    const col = k === 'rom' ? C.amb : k === 'dec' ? C.blu : C.wire;
    hilite(g, x, 26, w, 72, col, col, 1.8, 5);
    txt(g, x + 10, 44, lab, 13, col, null, 'bold');
    (OPS[state.op].boxes || ['', '', ''])[{ regs: 0, dec: 1, rom: 2 }[k]].split('\n')
      .forEach((ln, li) => txt(g, x + 10, 60 + li * 10.6, ln, 8.4, C.txt, null, null, true));
    line(g, [[dx, 98], [dx, RY[rail]]], COL[rail], 1.8, null, null, rail === 'rom' ? 'a' : rail === 'dx' ? 'b' : 'w');
  });
  for (const k in used) line(g, [[150, RY[k]], [k === 'fb2' ? 1001 : k === 'fb0' ? 991 : 975, RY[k]]], COL[k], 2);
  for (const i in (cy.lat || {})) {
    const cx = LANES[i], p = cy.lat[i];
    [[p.a, cx - MUX_DX, A_IN, A_OFF, 'A 25b'], [p.b, cx + MUX_DX, B_IN, B_OFF, 'B 28b']].forEach(([s, mx, ins, offs, lab]) => {
      if (!s) return;
      const held = s.src === 'hold';
      if (!held && !cy.hold) {
        const off = offs[ins.indexOf(s.src)];
        line(g, [[mx + off, RY[s.src]], [mx + off, MUX_Y]], COL[s.src], 2, null, null,
          s.src === 'rom' ? 'a' : s.src === 'dx' ? 'b' : s.src.startsWith('fb') ? 'r' : 'w');
        trap(g, mx, MUX_Y, 37, COL[s.src], 1.8);
        line(g, [[mx, MUX_Y + 24], [mx, LAT_Y]], COL[s.src], 1.8);
      } else trap(g, mx, MUX_Y, 37, C.dim, 1.2);
      txt(g, mx, MUX_Y + 16, short(s.txt, 9), 8.4, held ? C.sub : C.txt, 'middle', null, true);
      reg(g, mx - 42, LAT_Y, 84, 30, held ? C.sub : C.txt);
      txt(g, mx - 34, LAT_Y + 13, lab, 8.6, C.sub, null, null, true);
      txt(g, mx + 34, LAT_Y + 26, s.val === null || s.val === undefined ? '' : hx(s.val), 9.5, held ? C.sub : C.txt, 'end', null, true);
    });
  }
  for (const i in (cy.mul || {})) {
    const cx = LANES[i], m = cy.mul[i];
    hilite(g, cx - 88, FM_Y, 176, 78, C.hw, '#d1495b', 2, 8);
    txt(g, cx - 79, FM_Y + 17, 'FM' + i, 13, C.hw, null, 'bold');
    txt(g, cx + 79, FM_Y + 17, '25b × 28b', 9, C.sub, 'end', null, true);
    txt(g, cx, FM_Y + 42, short(m.op, 24), 11, C.txt, 'middle', null, true);
    txt(g, cx, FM_Y + 57, '(Σ rows + 2¹⁹) >>> 20', 9, C.sub, 'middle', null, true);
    txt(g, cx, FM_Y + 70, 'Booth, rows cut below col 16', 8.6, C.sub, 'middle');
    line(g, [[cx, FM_Y + 78], [cx, M_Y]], C.hw, 1.8);
  }
  for (const i in (cy.m || {})) {
    const cx = LANES[i];
    reg(g, cx - 56, M_Y, 112, 30, C.hw);
    txt(g, cx - 50, M_Y + 13, 'M' + i + ' 29b', 8.6, C.sub, null, null, true);
    txt(g, cx + 50, M_Y + 26, hx(cy.m[i]), 9.5, C.txt, 'end', null, true);
  }
  (cy.fb || []).forEach((i) => {
    const tap = i === 0 ? TAP0 : TAP2, x = i === 0 ? 991 : 1001, k = i === 0 ? 'fb0' : 'fb2';
    g.appendChild(el('circle', { cx: LANES[i], cy: tap, r: 3.5, fill: C.hw }));
    line(g, [[LANES[i], tap], [x, tap], [x, RY[k]]], C.hw, 2, null, null, 'r');
    box(g, 966, 200, 50, 22, C.hw, C.panel, 1.6, 4);
    txt(g, 991, 215, '>>>3', 10, C.hw, 'middle', 'bold', true);
  });
  if (cy.c0) {
    line(g, [[1000, 66], [1013, 66], [1013, SMUX_Y + 12], [LANES[1] + 44, SMUX_Y + 12]], C.amb, 2, null, null, 'a');
    txt(g, 1005, SMUX_Y + 4, 'C0', 10, C.amb, 'end', 'bold');
    trap(g, LANES[1], SMUX_Y, 42, C.amb, 1.8);
    txt(g, LANES[1], SMUX_Y + 16, 'M1 | C0', 9.5, C.txt, 'middle', null, true);
  } else if (cy.aln) {
    trap(g, LANES[1], SMUX_Y, 42, C.wire, 1.6);
    txt(g, LANES[1], SMUX_Y + 16, 'M1 | C0', 9.5, C.txt, 'middle', null, true);
  }
  for (const i in (cy.aln || {})) {
    const cx = LANES[i], a = cy.aln[i];
    hilite(g, cx - 74, AL_Y, 148, 52, C.blu, '#2e86ab', 1.8, 6);
    txt(g, cx, AL_Y + 16, a.c0 ? 'C0' : 'align', 12, C.txt, 'middle', 'bold');
    txt(g, cx + 68, AL_Y + 16, 'slot ' + i, 9, C.sub, 'end', null, true);
    txt(g, cx, AL_Y + 31, a.c0 ? 'sh=0  inv=0' : `sh=${a.sh}  inv=${a.inv ? 1 : 0}`, 10, C.txt, 'middle', null, true);
    txt(g, cx, AL_Y + 45, `q=${short(hx(a.q), 13)} c${a.cin}`, 9.5, C.sub, 'middle', null, true);
    line(g, [[cx, AL_Y + 52], [cx, AD_Y - 2]], C.wire, 1.8, null, null, 'w');
  }
  if (cy.add) {
    g.appendChild(el('polygon', { points: P([[64, AD_Y], [990, AD_Y], [860, AD_Y + 50], [194, AD_Y + 50]]),
      fill: '#2e86ab', 'fill-opacity': 0.20, stroke: C.blu, 'stroke-width': 2 }));
    txt(g, 214, AD_Y + 26, '4-input adder', 13, C.blu, null, 'bold');
    txt(g, 560, AD_Y + 22, cy.add.expr, 13, C.txt, 'middle', 'bold', true);
    txt(g, 560, AD_Y + 40, 'sum = ' + hx(cy.add.sum) + '  (' + cy.add.sum + ')', 10.5, C.sub, 'middle', null, true);
    line(g, [[527, AD_Y + 50], [527, SUM_Y]], C.wire, 1.8);
  }
  if (cy.sumreg !== undefined) {
    reg(g, 417, SUM_Y, 220, 30, C.blu);
    txt(g, 425, SUM_Y + 19, 'sum 35b', 9.5, C.sub, null, null, true);
    txt(g, 629, SUM_Y + 19, hx(cy.sumreg), 10.5, C.txt, 'end', null, true);
  }
  if (cy.nrm) {
    line(g, [[527, SUM_Y + 30], [527, NR_Y - 2]], C.wire, 1.8, null, null, 'w');
    hilite(g, 347, NR_Y, 360, 50, C.blu, '#2e86ab', 2.4, 8);
    txt(g, 527, NR_Y + 17, 'normalise + round', 13, C.txt, 'middle', 'bold');
    txt(g, 527, NR_Y + 31, 'negate · |·| · leading one · 24b · ' + (state.rz ? 'RZ' : 'RN'), 9.5, C.sub, 'middle', null, true);
    txt(g, 527, NR_Y + 45, 'emax = ' + cy.nrm.emax + (cy.nrm.negate ? '   negate = 1' : ''), 10, C.amb, 'middle', null, true);
    line(g, [[527, NR_Y + 50], [527, RES_Y]], C.wire, 1.8);
  }
  if (cy.resreg !== undefined) {
    reg(g, 417, RES_Y, 220, 30, C.amb);
    txt(g, 425, RES_Y + 19, 'result 32b', 9.5, C.sub, null, null, true);
    txt(g, 629, RES_Y + 19, hx32(cy.resreg), 10.5, C.txt, 'end', null, true);
  }
  if (cy.out) {
    line(g, [[527, RES_Y + 30], [527, OUT_Y - 16]], C.amb, 1.8, null, null, 'a');
    txt(g, 527, OUT_Y, 'FR / FV register file', 11, C.dimt, 'middle', null, true);
    txt(g, 640, OUT_Y, '→  ' + cy.out.label + ' = ' + floatStr(cy.out.bits), 12, C.amb, 'start', 'bold', true);
  }
}
const floatStr = (b) => { const f = new DataView(new ArrayBuffer(4)); f.setUint32(0, b >>> 0); const v = f.getFloat32(0);
  return hx32(b) + ' (' + (Number.isFinite(v) ? (Math.abs(v) > 1e-4 && Math.abs(v) < 1e7 || v === 0 ? +v.toPrecision(9) : v.toExponential(6)) : v) + ')'; };

// ---------------------------------------------------------------- inputs
const f2b = (f) => { const d = new DataView(new ArrayBuffer(4)); d.setFloat32(0, f); return d.getUint32(0); };
function parseVal(s) {
  s = (s || '').trim();
  if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16) >>> 0;     // raw bit pattern
  const v = parseFloat(s);
  return f2b(Number.isFinite(v) ? v : 0);
}
const OPS = {
  fipr: { boxes: ['FVm[i] → port A = {0, 1, mantissa}  25b\nFVn[i] → port B = {1, mantissa}  24b → 28b\nzero operand or E[i] ≤ 75 → that slot is 0',
                  'E[i] = ea + eb;  Emax = max valid E[i]\nsh[i] = min(Emax − E[i], 63);  inv[i] = sa ^ sb\nno decode of the operands beyond this',
                  'not used by FIPR'],
          label: 'FIPR', fields: [['FVm', 'fvm', ['1.5', '-2.25', '0.5', '3.14159']], ['FVn', 'fvn', ['0.75', '1.25', '-4.0', '1.4142136']]] },
  ftrv: { label: 'FTRV', matrix: ['0.8660254', '-0.5', '0', '2', '0.5', '0.8660254', '0', '-1', '0', '0', '1', '0.5', '0', '0', '0', '1'],
          fields: [['FV — the vector (v0..v3)', 'fv', ['1.0', '2.0', '3.0', '1.0']]],
          boxes: ['v[i]      → port A = {0, 1, mantissa}  25b\nm[row][i] → port B = {1, mantissa}   28b\nthe MATRIX element is the recoded operand',
                  'per pass, as FIPR:\nE[i] = ea + eb;  Emax = max valid E[i]\nsh[i] = min(Emax − E[i], 63);  inv[i] = sa ^ sb',
                  'not used by FTRV'] },
  fsca: { label: 'FSCA', scalar: ['angle (FPUL, 16 bit)', '0x2345'],
          boxes: ['FPUL[15:0] → decode;  no FR operand read\nresults → FR[n] = sin, FR[n+1] = cos\ndx is sign-extended into port A (25b)',
                  'node = FPUL[15:10] + FPUL[9]   (6b, wraps)\nr = node[3:0] → ROM;  q = node[5:4] quadrant\nt = signed FPUL[9:0];  dx = t << 13   (24b)\nswap = q[0]^cos;  negate = cos ? q1^q0 : q1',
                  'two 16-word ROMs: word r and word 16−r\neach word: C0 26b · L 23b · E 2b · Q 12b\nsine uses C0,L of one and L,Q of the other\nKC = 0x648340 (≈ 4π), one global constant'] },
  fsrra: { label: 'FSRRA', scalar: ['x (float or 0x bits)', '3.7'],
           boxes: ['FRn → decode (sign, exponent, mantissa)\nresult → FRn;  dx sign-extended into port A\nspecials bypass the block (see the log)',
                   'e = exp − 127;  k = e >> 1;  par = e[0]\nnode = (mant + 2^18) >> 19  (0..16, 24b add)\nent = par·17 + node;  t = signed mant[18:0]\ndx = t << 4;   emax = 254 − k',
                   '34 words addressed by {par, node}\nC0 27b · REC1 23b + E1 2b · REC2 14b · REC3 9b\nREC2, REC3 are FIXED-POINT (no exponent)'] },
};
const state = { op: 'fipr', rz: false, cycle: 0, trace: null };

function buildTabs() {
  const n = document.getElementById('tabs');
  n.innerHTML = '';
  for (const k in OPS) {
    const b = document.createElement('button');
    b.textContent = OPS[k].label; b.className = k === state.op ? 'on' : '';
    b.onclick = () => { state.op = k; buildTabs(); buildControls(); recompute(); };
    n.appendChild(b);
  }
}
function inp(id, val, cls) {
  const i = document.createElement('input');
  i.type = 'text'; i.id = id; i.value = val; if (cls) i.className = cls;
  i.oninput = () => recompute(true);
  return i;
}
function buildControls() {
  const c = document.getElementById('controls'), op = OPS[state.op];
  c.innerHTML = '';
  if (op.matrix) {
    const g = document.createElement('div'); g.className = 'grp';
    g.appendChild(Object.assign(document.createElement('label'), { textContent: 'XMTRX rows (row i · v)' }));
    for (let r = 0; r < 4; r++) {
      const row = document.createElement('div'); row.className = 'row';
      for (let j = 0; j < 4; j++) row.appendChild(inp(`m${r}${j}`, op.matrix[r * 4 + j], 'mat'));
      g.appendChild(row);
    }
    c.appendChild(g);
  }
  (op.fields || []).forEach(([name, pre, defs]) => {
    const g = document.createElement('div'); g.className = 'grp';
    g.appendChild(Object.assign(document.createElement('label'), { textContent: name }));
    const row = document.createElement('div'); row.className = 'row';
    defs.forEach((d, i) => row.appendChild(inp(pre + i, d)));
    g.appendChild(row); c.appendChild(g);
  });
  if (op.scalar) {
    const g = document.createElement('div'); g.className = 'grp';
    g.appendChild(Object.assign(document.createElement('label'), { textContent: op.scalar[0] }));
    const row = document.createElement('div'); row.className = 'row';
    row.appendChild(inp('scalar', op.scalar[1]));
    const note = document.createElement('span'); note.id = 'scalarnote';
    note.style.cssText = 'color:var(--sub);font:12px var(--mono);align-self:center';
    row.appendChild(note); g.appendChild(row); c.appendChild(g);
  }
  const g = document.createElement('div'); g.className = 'grp';
  g.appendChild(Object.assign(document.createElement('label'), { textContent: 'rounding (FPSCR.RM)' }));
  const sel = document.createElement('select');
  sel.innerHTML = '<option value="0">RN — nearest even</option><option value="1">RZ — truncate</option>';
  sel.value = state.rz ? '1' : '0';
  sel.onchange = () => { state.rz = sel.value === '1'; recompute(true); };
  g.appendChild(sel); c.appendChild(g);
  const t = document.createElement('div'); t.className = 'transport';
  t.innerHTML = '<button id="back">◀ back</button><span id="cyc"></span><button id="next">next ▶</button><button id="rst">reset</button>';
  c.appendChild(t);
  t.querySelector('#back').onclick = () => step(-1);
  t.querySelector('#next').onclick = () => step(1);
  t.querySelector('#rst').onclick = () => { state.cycle = 0; render(); };
}

function recompute(keepCycle) {
  const old = state.cycle;
  try {
    if (state.op === 'fipr') {
      const i = { a: [0, 1, 2, 3].map((k) => parseVal(document.getElementById('fvm' + k).value)),
                  b: [0, 1, 2, 3].map((k) => parseVal(document.getElementById('fvn' + k).value)) };
      state.trace = traceFIPR(i.a, i.b, state.rz);
    } else if (state.op === 'ftrv') {
      const m = [0, 1, 2, 3].map((r) => [0, 1, 2, 3].map((j) => parseVal(document.getElementById(`m${r}${j}`).value)));
      const v = [0, 1, 2, 3].map((i) => parseVal(document.getElementById('fv' + i).value));
      state.trace = traceFTRV(m, v, state.rz);
    } else if (state.op === 'fsca') {
      const s = document.getElementById('scalar').value.trim();
      const ang = (/^0x/i.test(s) ? parseInt(s, 16) : parseInt(s, 10) || 0) & 0xffff;
      document.getElementById('scalarnote').textContent = `= ${ang} = ${(ang * 360 / 65536).toFixed(3)}°`;
      state.trace = traceFSCA(ang, state.rz);
    } else {
      const s = document.getElementById('scalar').value.trim(), bits = parseVal(s);
      const d = new DataView(new ArrayBuffer(4)); d.setUint32(0, bits);
      document.getElementById('scalarnote').textContent = `= ${hx32(bits)} = ${d.getFloat32(0)}`;
      state.trace = traceFSRRA(bits, state.rz);
    }
  } catch (e) { console.error(e); return; }
  state.cycle = keepCycle ? Math.min(old, state.trace.cycles.length - 1) : 0;
  render();
}
function applyHash() {
  const m = /^#(fipr|ftrv|fsca|fsrra)(?:\/(\d+))?/.exec(location.hash || '');
  if (!m) return null;
  state.op = m[1];
  return m[2] === undefined ? 0 : parseInt(m[2], 10);
}
function step(d) {
  state.cycle = Math.max(0, Math.min(state.trace.cycles.length - 1, state.cycle + d));
  render();
}
function render() {
  const cs = state.trace.cycles, cy = cs[state.cycle];
  drawOverlay(cy);
  document.getElementById('cyc').textContent = `cycle ${state.cycle} / ${cs.length - 1}`;
  document.getElementById('back').disabled = state.cycle === 0;
  document.getElementById('next').disabled = state.cycle === cs.length - 1;
  document.getElementById('stage').innerHTML = `<em>${cy.tag}</em>${cy.title}`;
  const log = document.getElementById('log');
  log.innerHTML = cs.slice(0, state.cycle + 1).map((c, i) => {
    const lines = (c.log || []).map((l) => `<div class="ln"><span class="p">${l.part}</span><span class="v">${l.text}</span></div>`).join('');
    return `<div class="cyc${i === state.cycle ? ' now' : ''}"><div class="hd">cycle ${i} · ${c.tag} — ${c.title}</div>${lines}</div>`;
  }).join('');
  const now = log.querySelector('.cyc.now');
  if (now) { const r = now.getBoundingClientRect();
    if (r.bottom > innerHeight || r.top < 0) now.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  history.replaceState(null, '', `#${state.op}/${state.cycle}`);
}
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') step(e.shiftKey ? 4 : 1);
  if (e.key === 'ArrowLeft') step(e.shiftKey ? -4 : -1);
});
const topbar = document.getElementById('topbar');
const syncTopbar = () => document.documentElement.style.setProperty('--topbar', topbar.offsetHeight + 'px');
new ResizeObserver(syncTopbar).observe(topbar);
addEventListener('resize', syncTopbar);

const hashCycle = applyHash();
buildTabs(); buildControls(); buildDiagram(); recompute();
if (hashCycle) { state.cycle = Math.min(hashCycle, state.trace.cycles.length - 1); render(); }
addEventListener('hashchange', () => { const c = applyHash(); buildTabs(); buildControls(); recompute();
  if (c) { state.cycle = Math.min(c, state.trace.cycles.length - 1); render(); } });
</script>
</body>
</html>
